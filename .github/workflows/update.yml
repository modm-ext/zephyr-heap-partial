name: Update

on:
  schedule:
    - cron:  '28 8 * * 3'
  workflow_dispatch:
  pull_request:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.email "bot@modm.io"
          git config --global user.name "modm update bot"
      - name: Run update.py script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wget -qL https://raw.githubusercontent.com/modm-ext/partial/main/partial.py
          python3 update.py
      - name: Compile check
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -c heap/heap.c -o /tmp/heap.o
      - name: Git push
        if: github.ref == 'refs/heads/main'
        run: |
          git push origin main
